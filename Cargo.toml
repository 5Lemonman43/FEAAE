[package]
name = "polymarket-arbitrage-bot"
version = "0.1.0"
edition = "2021"

[lib]
name = "polymarket_arbitrage_bot"
path = "src/lib.rs"

[[bin]]
name = "polymarket-arbitrage-bot"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
anyhow = "1.0"
thiserror = "1.0"
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
rust_decimal = { version = "1.35", features = ["serde-float"] }

[dev-dependencies]
serial_test = "3.0"
